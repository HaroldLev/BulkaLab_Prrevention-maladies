name: Export MP4

on:
  push:
    paths:
      - 'storyboards/**'
  workflow_dispatch:
    inputs:
      slug:
        description: 'Slug du storyboard à exporter (vide = tous)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Dépendances
        run: pip install pillow piper-tts

      - name: Génération frames + audio
        run: |
          mkdir -p out
          SLUG="${{ github.event.inputs.slug }}"
          if [ -z "$SLUG" ]; then
            LIST=$(ls storyboards/*.json)
          else
            LIST="storyboards/$SLUG.json"
          fi
          SLUGS_ALL=""
          for SB in $LIST; do
            SLUG_JSON=$(basename "$SB" .json)
            mkdir -p "out/$SLUG_JSON"
            python generate.py --storyboard "$SB" --out "out/$SLUG_JSON"
            SLUGS_ALL="$SLUGS_ALL $SLUG_JSON"
          done
          echo "SLUGS=$SLUGS_ALL" >> "$GITHUB_ENV"

      - name: Voix narrée (Piper TTS)
        env:
          SLUGS: ${{ env.SLUGS }}
        run: |
          for SLUG in $SLUGS; do
            # sans champ voice -> exit 0 (musique seule) ; avec voice -> tout échec est FATAL
            python tts_narration.py --storyboard "storyboards/$SLUG.json" --out "out/$SLUG"
          done

      - name: Assemblage MP4
        env:
          SLUGS: ${{ env.SLUGS }}
        run: |
          which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          for SLUG in $SLUGS; do
            FPS=$(python -c "import json;print(json.load(open('out/$SLUG/meta.json'))['fps'])")
            NAR="out/$SLUG/narration.wav"
            if [ -f "$NAR" ]; then
              ffmpeg -y -loglevel error -framerate $FPS -i "out/$SLUG/frames/frame_%05d.jpg" -i "out/$SLUG/audio.wav" -i "$NAR" \
                -filter_complex "[1:a]volume=0.30[m];[2:a]volume=1.35[v];[m][v]amix=inputs=2:duration=first:normalize=0,alimiter=limit=0.95,aresample=44100[aout]" \
                -map 0:v -map "[aout]" \
                -c:v libx264 -preset medium -crf 20 -pix_fmt yuv420p \
                -c:a aac -b:a 160k -movflags +faststart \
                "out/$SLUG.mp4"
            else
              ffmpeg -y -loglevel error -framerate $FPS -i "out/$SLUG/frames/frame_%05d.jpg" -i "out/$SLUG/audio.wav" \
                -c:v libx264 -preset medium -crf 20 -pix_fmt yuv420p \
                -c:a aac -b:a 160k -shortest -movflags +faststart \
                "out/$SLUG.mp4"
            fi
            ls -la "out/$SLUG.mp4"
          done

      - name: Publication en release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SLUGS: ${{ env.SLUGS }}
        run: |
          TAG="export-$(date +%Y%m%d-%H%M%S)"
          ARGS=(release create "$TAG" --title "Export $TAG" --notes "Export MP4 automatique")
          for SLUG in $SLUGS; do
            cp "out/$SLUG.mp4" "$SLUG.mp4"
            ARGS+=("$SLUG.mp4")
            # images allégées pour le canvas React (générées par generate.py)
            if [ -d "out/$SLUG/canvas-images" ]; then
              for IMG in out/$SLUG/canvas-images/*.jpg; do
                BASE=$(basename "$IMG" _small.jpg)
                cp "$IMG" "$SLUG-canvas-$BASE.jpg"
                ARGS+=("$SLUG-canvas-$BASE.jpg")
              done
            fi
          done
          gh "${ARGS[@]}"
